<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <title>Product Scrape By Prime Source LK</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="toastHost" class="toast-host" aria-live="polite"></div>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <h1>Product Scrape</h1>
          <p>By Prime Source LK</p>
        </div>
      </header>

      <section class="workspace">
        <section class="upload-panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Screenshots</p>
              <h2>Upload Product Pages</h2>
            </div>
            <button id="clearBtn" class="icon-button" type="button">Clear</button>
          </div>

          <label id="dropZone" class="drop-zone">
            <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/*" multiple>
            <span class="drop-title">Choose up to 10 screenshots</span>
            <span class="drop-subtitle">Temu, AliExpress, Shein, or any product pages</span>
          </label>

          <section class="settings-panel" aria-label="AI settings">
            <div class="field-row">
              <label for="providerSelect">AI Provider</label>
              <select id="providerSelect">
                <option value="gemini">Gemini</option>
                <option value="openai">OpenAI</option>
                <option value="ollama">Ollama Local</option>
              </select>
            </div>
            <div class="field-row">
              <label for="modelInput">Model</label>
              <input id="modelInput" type="text" autocomplete="off" spellcheck="false">
            </div>
            <div id="apiKeyRow" class="field-row">
              <label for="apiKeyInput">API Key</label>
              <input id="apiKeyInput" type="password" autocomplete="off" spellcheck="false" placeholder="Paste API key">
            </div>
            <div id="ollamaUrlRow" class="field-row is-hidden">
              <label for="ollamaUrlInput">Ollama URL</label>
              <input id="ollamaUrlInput" type="text" autocomplete="off" spellcheck="false">
            </div>
            <button id="saveSettingsBtn" class="small-button" type="button">Save AI Settings</button>
          </section>

          <div id="fileList" class="file-list"></div>

          <div id="previewWrap" class="preview-wrap is-hidden">
            <img id="previewImage" alt="Uploaded product screenshot preview">
          </div>

          <button id="analyzeBtn" class="primary-button" type="button" disabled>Analyze Screenshots</button>
          <p id="errorText" class="error-text" role="alert"></p>
        </section>

        <section class="results-panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Result</p>
              <h2>Product Details</h2>
            </div>
            <div class="result-actions">
              <button id="copyBatchBtn" class="secondary-button" type="button" disabled>Copy Batch</button>
              <button id="copyAllBtn" class="secondary-button" type="button" disabled>Copy Current</button>
            </div>
          </div>

          <div id="emptyState" class="empty-state">
            <strong>No analysis yet</strong>
            <span>Upload one or more product screenshots to create clean resale listing text.</span>
          </div>

          <div id="resultContent" class="result-content is-hidden">
            <article class="summary-block">
              <div>
                <p id="sourcePlatform" class="eyebrow">Unknown source</p>
                <h3 id="productTitle"></h3>
              </div>
              <strong id="priceText" class="price-text"></strong>
            </article>
            <div id="detailsGrid" class="details-grid"></div>
            <section class="text-section">
              <div class="section-head">
                <h3>Listing Text</h3>
              </div>
              <textarea id="fullTextOutput" readonly></textarea>
            </section>
          </div>
        </section>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
